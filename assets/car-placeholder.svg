<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161C"/>
      <stop offset="55%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="cp-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D2E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3D2E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#cp-bg)"/>
  <rect width="800" height="500" fill="url(#cp-grid)"/>
  <!-- checkered accent strip -->
  <g opacity="0.14">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="20" height="20" fill="#fff"/>
      <rect x="20" y="20" width="20" height="20" fill="#fff"/>
      <rect x="40" y="0" width="20" height="20" fill="#fff"/>
      <rect x="60" y="20" width="20" height="20" fill="#fff"/>
    </g>
  </g>
  <line x1="0" y1="330" x2="800" y2="330" stroke="url(#cp-line)" stroke-width="2"/>
  <!-- abstract speed silhouette (not a specific car) -->
  <g transform="translate(160,240)" opacity="0.9">
    <ellipse cx="240" cy="150" rx="230" ry="14" fill="#000" opacity="0.35"/>
    <path d="M0 120 C 40 60, 140 20, 260 20 C 340 20, 380 40, 430 70 L 480 70 L 480 130 L 0 130 Z"
          fill="none" stroke="#3A3F4A" stroke-width="3"/>
    <path d="M40 130 C 60 70, 150 30, 260 30" fill="none" stroke="#565D6B" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="110" cy="132" r="34" fill="#0A0A0F" stroke="#3A3F4A" stroke-width="3"/>
    <circle cx="110" cy="132" r="12" fill="#1A1D24"/>
    <circle cx="380" cy="132" r="34" fill="#0A0A0F" stroke="#3A3F4A" stroke-width="3"/>
    <circle cx="380" cy="132" r="12" fill="#1A1D24"/>
  </g>
  <g transform="translate(400,150)" text-anchor="middle">
    <text x="0" y="0" font-family="Rajdhani, Arial, sans-serif" font-weight="600" font-size="20" letter-spacing="6" fill="#5C6270">SEM FOTO CADASTRADA</text>
  </g>
</svg>

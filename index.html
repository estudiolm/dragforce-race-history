<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DragForce · Race History</title>
<meta name="description" content="DragForce Race History — plataforma de gestão e histórico de competição da equipe." />
<link rel="icon" type="image/png" href="assets/logos/favicon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b0c11" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DragForce" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="app-header__inner">
      <a href="#/" class="brand" aria-label="DragForce Motorsport — início">
        <img class="brand-logo" src="assets/logos/dragforce-motorsport.png" alt="DragForce Motorsport" />
      </a>

      <nav class="main-nav" id="main-nav">
        <a href="#/" data-route="/">Dashboard</a>
        <a href="#/carros" data-route="/carros">Carros</a>
        <a href="#/sobre" data-route="/sobre">Sobre</a>
      </nav>

      <div class="header-actions">
        <div class="header-actions__boost" title="Powered by Boost Club">
          <span>Powered by</span>
          <img src="assets/logos/boostclub-logo.png" alt="Boost Club" />
        </div>
        <button id="install-app-btn" class="btn-icon" style="display:none" aria-label="Instalar o DragForce como app" title="Instalar o DragForce como app no seu dispositivo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <a href="#/login" id="account-btn" class="btn-icon" aria-label="Área da equipe" title="Área da equipe">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="page-root" class="page"></main>

  <footer class="app-footer">
    <div class="app-footer__inner">
      <div class="app-footer__brand">
        <span class="app-footer__brand-name">DRAGFORCE RACE HISTORY</span>
        <span class="app-footer__brand-sub">Ficha digital de competição da equipe</span>
      </div>
      <div class="app-footer__powered">
        <span>Powered by</span>
        <img src="assets/logos/boostclub-logo.png" alt="Boost Club" />
      </div>
    </div>
  </footer>
</div>

<script src="assets/vendor/chart.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/users.js"></script>
<script src="js/db.js"></script>
<script src="js/db-supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/cars.js"></script>
<script src="js/pages/car-detail.js"></script>
<script src="js/pages/about.js"></script>
<script src="js/pages/login.js"></script>
<script src="js/app.js"></script>
</body>
</html>
